name: Build sensor-monitor

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/sensor-monitor/**"
      - ".github/workflows/sensor-monitor.yml"
    tags:
      - "sensor-monitor-v*"
  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/sensor-monitor/**"
      - ".github/workflows/sensor-monitor.yml"
  workflow_dispatch:

# Each app under apps/ is an independent Gradle project. This workflow builds
# only sensor-monitor; other apps have their own workflows and tag prefixes.
defaults:
  run:
    working-directory: apps/sensor-monitor

permissions:
  contents: write   # needed to create a Release on tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Fails the build rather than silently producing an APK signed with a
      # throwaway key, which could not be installed over a previous release.
      - name: Verify signing is configured
        run: ./gradlew :app:verifySigningConfigured --no-daemon
        env:
          SM_KEYSTORE_BASE64: ${{ secrets.SM_KEYSTORE_BASE64 }}
          SM_KEYSTORE_PASSWORD: ${{ secrets.SM_KEYSTORE_PASSWORD }}
          SM_KEY_ALIAS: ${{ secrets.SM_KEY_ALIAS }}
          SM_KEY_PASSWORD: ${{ secrets.SM_KEY_PASSWORD }}

      - name: Run unit tests (formatting and sensor state)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sensor-monitor-test-report
          path: apps/sensor-monitor/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          SM_KEYSTORE_BASE64: ${{ secrets.SM_KEYSTORE_BASE64 }}
          SM_KEYSTORE_PASSWORD: ${{ secrets.SM_KEYSTORE_PASSWORD }}
          SM_KEY_ALIAS: ${{ secrets.SM_KEY_ALIAS }}
          SM_KEY_PASSWORD: ${{ secrets.SM_KEY_PASSWORD }}

      - name: Rename APK with version
        id: apk
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT="sensor-monitor-v${VERSION_NAME}.apk"
          cp "$SRC" "$OUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=apps/sensor-monitor/$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload APK artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/sensor-monitor-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "sensor-monitor ${{ github.ref_name }}"
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
